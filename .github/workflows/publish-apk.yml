name: Assemble signed APK release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Signed APK version
        required: true
        type: string
      sha256:
        description: Expected SHA-256 of assembled APK
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify the approved binary
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cat "staging/v$VERSION"/part* > iPadRepairPilot.apk
          printf '%s  iPadRepairPilot.apk\n' "$EXPECTED_SHA" | sha256sum --check
      - name: Create public release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" iPadRepairPilot.apk --clobber
          else
            gh release create "v$VERSION" iPadRepairPilot.apk --title "iPad Repair Pilot $VERSION" --notes "Signed Android pilot update."
          fi
